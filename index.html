<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="hero">

        <div class="spin-cursor" id="spin-cursor" aria-hidden="true">
            <div class="spin-cursor-arrow"></div>
        </div>

        <!-- BURBUJA SUPERIOR -->
        <div class="bubble-box">
            <h1 id="dynamic-text">Welcome</h1>
        </div>

        <!-- ICONO CENTRAL -->
        <div class="elementos-externos">
            <div class="icono-wrap" id="main-icono">
                <img src="assets/imagenes/iconos/icono.png" alt="Icono" class="icono icono-original">
                <img src="assets/imagenes/iconos/icono_hover.png" alt="Icono hover" class="icono icono-hover">
            </div>
        </div>

        <!-- TEXTO INFERIOR -->
        <div class="entrar">
            <img src="assets/imagenes/fondos/dolphin.gif" alt="Delfin" class="delfin">
            <div class="enter-bubble">
                <span id="enter-text">click to enter...</span>
            </div>
            <img src="assets/imagenes/fondos/dolphin.gif" alt="Delfin" class="delfin">
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
